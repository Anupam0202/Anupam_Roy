name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # The provider-policy gate: every outbound provider must have a valid, reviewed policy.
      - run: pnpm run validate:providers
      # Source rules, type checks, unit and integration tests, builds, post-build checks.
      - run: pnpm run build
        env:
          PAGE_WEIGHTS_OUT: page-weights.txt
      - run: pnpm run audit:prod
      - if: matrix.node == '24'
        run: pnpm --filter @workspace/proof-atlas exec playwright install --with-deps chromium
      - if: matrix.node == '24'
        run: pnpm --filter @workspace/proof-atlas exec playwright test --project=chromium
        env:
          CI: "true"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-weights-node-${{ matrix.node }}
          path: page-weights.txt
          retention-days: 7
          if-no-files-found: ignore
      - if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/proof-atlas/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The official image ships WebKit and its system libraries for this Playwright
    # version, so no apt install runs (it stalled on slow package mirrors).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @workspace/proof-atlas exec playwright test --project=webkit
        env:
          CI: "true"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: artifacts/proof-atlas/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history
        # --verbose names the file, line and rule of each finding; --redact hides the value.
        run: ./gitleaks git --redact --verbose --no-banner --exit-code 1 .
